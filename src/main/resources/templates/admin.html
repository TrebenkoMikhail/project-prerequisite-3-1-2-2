<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin and User Information Page</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        .navbar-text1 {
            color: white;
        }
        .navbar-text2 {
            color: white;
        }
        .navbar .logout-link {
            color: grey;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
   <span class="navbar-text">
        <span id="username" class="navbar-text1">${username} with</span>
        <span id="roles" class="navbar-text2">${roles}</span>
    </span>
    <div class="ml-auto">
        <a href="/logout" class="logout-link">Logout</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="row">
        <div class="col-2">
            <ul id="nav-items" class="nav flex-column">
                <li class="nav-item">
                    <a id="admin-link" class="nav-link" href="#" onclick="showAdmin(); return false;">Admin</a>
                </li>
                <li class="nav-item">
                    <a id="user-link" class="nav-link" href="#" onclick="showUser(); return false;">User</a>
                </li>
            </ul>
        </div>
        <div id="user-panel" class="col-10">
            <h1>User Information Page</h1>
            <div class="card mt-3">
                <div class="card-header">
                    <h3>About User</h3>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Roles</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!--ADMIN_DATA-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>


<div id="admin-panel" style="display: none;" class="col-10">
    <h1>Admin Panel</h1>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" id="all-users-tab" href="#" onclick="switchTab(event, 'all-users')">All Users</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="new-user-tab" href="#" onclick="switchTab(event, 'new-user'); loadRoles();">New User</a>
        </li>
    </ul>

    <div class="tab-content">
        <div id="all-users" class="tab-pane active" href="/api/admin/allUsers">
            <div id="page-content" class="card mt-3">
                <div class="card-header">
                    All Users
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody >
                        <!--USERS_DATA-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="new-user" class="tab-pane">
            <div class="card mt-3">
                <div class="card-header">
                    New User
                </div>
                <div class="card-body">
                    <form id="new-user-form" onsubmit="submitNewUserForm(event)">
                        <div class="form-group">
                            <label for="add-firstname">First Name</label>
                            <input type="text" class="form-control" id="add-firstname" required>
                        </div>
                        <div class="form-group">
                            <label for="add-lastname">Last Name</label>
                            <input type="text" class="form-control" id="add-lastname" required>
                        </div>
                        <div class="form-group">
                            <label for="add-age">Age</label>
                            <input type="number" class="form-control" id="add-age" required>
                        </div>
                        <div class="form-group">
                            <label for="add-email">Email</label>
                            <input type="email" class="form-control" id="add-email" required>
                        </div>
                        <div class="form-group">
                            <label for="add-username">Username</label>
                            <input type="text" class="form-control" id="add-username" required>
                        </div>
                        <div class="form-group">
                            <label for="add-password">Password</label>
                            <input type="password" class="form-control" id="add-password" required>
                        </div>
                        <div class="form-group">
                            <label for="addRoles">Roles</label>
                            <select id="addRoles" class="form-control" name="roles" multiple required>
                                <option value="ROLE_USER">User</option>
                                <option value="ROLE_ADMIN">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Add User</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>
</div>

        <div class="modal fade" id="editUserModal" tabindex="-1" role="dialog" aria-labelledby="editUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="editUserForm" th:action="@{/api/admin/edit}" method="post">
                            <input type="hidden" id="edit-id" name="id">
                            <div class="form-group">
                                <label for="edit-firstname">Firstname:</label>
                                <input type="text" class="form-control" id="edit-firstname" name="firstname" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-lastname">Lastname:</label>
                                <input type="text" class="form-control" id="edit-lastname" name="lastname" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-age">Age:</label>
                                <input type="text" class="form-control" id="edit-age" name="age" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-email">Email:</label>
                                <input type="email" class="form-control" id="edit-email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-username">Username:</label>
                                <input type="text" class="form-control" id="edit-username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-password">Password:</label>
                                <input type="password" class="form-control" id="edit-password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-roles">Roles:</label>
                                <select type="text" class="form-control" id="edit-roles" name="roles" multiple required>
                                    <option value="ROLE_USER">User</option>
                                    <option value="ROLE_ADMIN">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Save changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="deleteUserModal" tabindex="-1" role="dialog" aria-labelledby="deleteUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="deleteUserForm">
                            <div class="form-group">
                                <label for="delete-id">ID</label>
                                <input type="text" class="form-control" id="delete-id" name="id" readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-firstname">First Name</label>
                                <input type="text" class="form-control" id="delete-firstname" name="firstname" readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-lastname">Last Name</label>
                                <input type="text" class="form-control" id="delete-lastname" name="lastname" readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-age">Age</label>
                                <input type="text" class="form-control" id="delete-age" name="age" readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-email">Email</label>
                                <input type="email" class="form-control" id="delete-email" name="email" readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-password">Password</label>
                                <input type="password" class="form-control" id="delete-password" name="password"
                                       readonly>
                            </div>
                            <div class="form-group">
                                <label for="delete-role">Role</label>
                                <select class="form-control" id="delete-role" name="role" readonly>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="USER">USER</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-danger">Delete</button>
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const activePanel = localStorage.getItem('activePanel') || 'user'; // Default to 'user'

        if (activePanel === 'admin') {
            showAdmin();
        } else {
            showUser();
        }
    });

    function showUser() {
        document.getElementById('user-panel').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('user-link').classList.add('active');
        document.getElementById('admin-link').classList.remove('active');
        localStorage.setItem('activePanel', 'user');
    }

    function showAdmin() {
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('user-panel').style.display = 'none';
        document.getElementById('admin-link').classList.add('active');
        document.getElementById('user-link').classList.remove('active');
        localStorage.setItem('activePanel', 'admin');
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadAllUsers();
    });

    function loadAllUsers() {
        fetch('/api/admin/allUsers')
            .then(response => response.text())
            .then(html => {
                document.querySelector('#all-users tbody').innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading users:', error);
            });
    }

    function switchTab(event, tabId) {
        event.preventDefault();

        document.querySelectorAll('.nav-link').forEach(function (tab) {
            tab.classList.remove('active');
        });

        document.querySelectorAll('.tab-pane').forEach(function (tabContent) {
            tabContent.classList.remove('active');
        });

        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function loadRoles(selectedRoles = []) {
        fetch('/api/admin/roles')
            .then(response => response.json())
            .then(roles => {
                const rolesSelect = document.getElementById('edit-roles');
                rolesSelect.innerHTML = '';

                roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.name;
                    option.textContent = role.name;

                    if (selectedRoles.includes(role.name)) {
                        option.selected = true;
                    }

                    rolesSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error loading roles:', error);
            });
    }

    function submitNewUserForm(event) {
        event.preventDefault();

        const selectedRoles = Array.from(document.getElementById('addRoles').selectedOptions)
            .map(option => ({name: option.value}));

        const user = {
            firstname: document.getElementById('add-firstname').value,
            lastname: document.getElementById('add-lastname').value,
            age: document.getElementById('add-age').value,
            username: document.getElementById('add-username').value,
            password: document.getElementById('add-password').value,
            email: document.getElementById('add-email').value,
            roles: selectedRoles
        };

        fetch('/api/admin/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('User added successfully!');
                    document.getElementById('new-user-form').reset();
                    location.reload();
                } else {
                    alert('Failed to add user.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred.');
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.addEventListener('click', function (event) {
            if (event.target.classList.contains('edit')) {
                const userId = event.target.getAttribute('data-id');
                fetch(`/api/admin/user/${userId}`)
                    .then(response => response.json())
                    .then(user => {
                        document.getElementById('edit-id').value = user.id;
                        document.getElementById('edit-firstname').value = user.firstname;
                        document.getElementById('edit-lastname').value = user.lastname;
                        document.getElementById('edit-age').value = user.age;
                        document.getElementById('edit-email').value = user.email;
                        document.getElementById('edit-username').value = user.username;
                        document.getElementById('edit-password').value = user.password;
                        loadRoles(user.roles.map(role => role.name));

                        $('#editUserModal').modal('show');
                    })
                    .catch(error => console.error('Error:', error));
            }
        });

        document.addEventListener('click', function (event) {
            if (event.target.classList.contains('delete')) {
                const userId = event.target.getAttribute('data-id');

                fetch(`/api/admin/user/${userId}`)
                    .then(response => response.json())
                    .then(user => {
                        document.getElementById('delete-id').value = user.id;
                        document.getElementById('delete-firstname').value = user.firstname;
                        document.getElementById('delete-lastname').value = user.lastname;
                        document.getElementById('delete-age').value = user.age;
                        document.getElementById('delete-email').value = user.email;
                        document.getElementById('delete-password').value = user.password;

                        $('#deleteUserModal').modal('show');
                    })
                    .catch(error => console.error('Error:', error));
            }
        });

        function submitEditUserForm(event) {
            event.preventDefault();

            const userId = document.getElementById('edit-id').value;
            const formData = new FormData(document.getElementById('editUserForm'));

            const data = {};
            formData.forEach((value, key) => {
                if (key === 'roles') {
                    if (!data[key]) {
                        data[key] = [];
                    }
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            fetch(`/api/admin/edit/${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        $('#editUserModal').modal('hide');
                        location.reload();
                    } else {
                        alert('Failed to update user.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert(`An error occurred: ${error.message}`);
                });
        }

        document.getElementById('editUserForm').addEventListener('submit', submitEditUserForm);
        document.getElementById('deleteUserForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const userId = document.getElementById('delete-id').value;

            fetch(`/api/admin/delete/${userId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (response.ok) {
                        $('#deleteUserModal').modal('hide');
                        location.reload();
                    } else {
                        throw new Error('Failed to delete user');
                    }
                })
                .catch(error => console.error('Error:', error));
        });
    });

</script>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
