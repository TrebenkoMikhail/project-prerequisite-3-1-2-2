<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manager</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.j"></script>
    <script src="https://cdn.jsdelivr.net/npm"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.j"></script>
</head>
<body>
<div class="container mt-5">
<h1>!Admin, welcome to the Spring Boot Security page!</h1>
<button class="btn btn-primary" data-toggle="modal" data-target="#addUserModal">Add User</button>
<table class="table mt-3">
    <thead>
    <tr>
        <th>ID</th>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
        <th>Email</th>
        <th>Username</th>
        <th>Password</th>
        <th>Roles</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody id="userTable">
    <tr th:each="user : ${user}">
        <td th:text="${user.id}">ID</td>
        <td th:text="${user.firstname}">Firstname</td>
        <td th:text="${user.lastname}">Lastname</td>
        <td th:text="${user.age}">Age</td>
        <td th:text="${user.email}">Email</td>
        <td th:text="${user.username}">Username</td>
        <td th:text="${user.password}">Password</td>
        <td th:each="role : ${user.authorities}" th:text="${role.authority}">Roles</td>
    </tr>
    </tbody>
</table>
<a th:href="@{/logout}">Logout</a>
<script src="/js/"></script>
<script src="/js/"></script>
<script src="/js/bootstrap.min.js"></script>
</div>
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="model-title" id="addUserModalLabel">Add User</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="form-group">
                        <label for="addUsername">Username</label>
                        <input type="text" class="form-control" id="addUsername" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="addPassword">Username</label>
                        <input type="text" class="form-control" id="addPassword" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="addFirstname">Username</label>
                        <input type="text" class="form-control" id="addFirstname" name="firstname" required>
                    </div>
                    <div class="form-group">
                        <label for="addLastname">Username</label>
                        <input type="text" class="form-control" id="addLastname" name="lastname" required>
                    </div>
                    <div class="form-group">
                        <label for="addAge">Username</label>
                        <input type="text" class="form-control" id="addAge" name="age" required>
                    </div>
                    <div class="form-group">
                        <label for="addEmail">Username</label>
                        <input type="text" class="form-control" id="addEmail" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="addRoles">Username</label>
                        <select id="addRoles" name="roles" th:field="*{user.roles}" required>
                            <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add User</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="model-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="close">
                    <span aria
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
