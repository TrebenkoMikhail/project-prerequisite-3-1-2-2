<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin and User Information Page</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        .navbar-text1 {
            color: white;
        }
        .navbar-text2 {
            color: white;
        }
        .navbar .logout-link {
            color: grey;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
   <span class="navbar-text">
        <span id="username" class="navbar-text1">${username} with</span>
        <span id="roles" class="navbar-text2">${roles}</span>
    </span>
    <div class="ml-auto">
        <a href="/logout" class="logout-link">Logout</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="row">
        <div class="col-2">
            <ul id="nav-items" class="nav flex-column">
                <li class="nav-item">
                    <a id="admin-link" class="nav-link" href="/api/admin/allUsers" onclick="loadAdminPage()">Admin</a>
                </li>
                <li class="nav-item">
                    <a id="user-link" class="nav-link" href="#" onclick="loadUserPage()">User</a>
                </li>
            </ul>
        </div>
        <div class="col-10">
            <h1 id="page-title">User Information Page</h1>
            <div id="page-content" class="card mt-3">
                <!-- Content will be dynamically loaded here -->
                <div class="card-header">
                    About User
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Roles</th>
                        </tr>
                        </thead>
                        <tbody id="user-info">
                        <!--USER_DATA-->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadUserPage();
    });

    function loadUserPage() {
        document.getElementById('page-title').textContent = 'User Information Page';
        document.getElementById('user-link').classList.add('active');
        document.getElementById('admin-link').classList.remove('active');
        fetch('/api/user')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('username').textContent = data.username + ' with';
                document.getElementById('roles').textContent = data.roles.join(', ');
                document.getElementById('page-content').innerHTML = `
                    <div class="card-header">About User</div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Roles</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>${data.id}</td>
                                <td>${data.firstname}</td>
                                <td>${data.lastname}</td>
                                <td>${data.age}</td>
                                <td>${data.email}</td>
                                <td>${data.roles.join(', ')}</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            })
            .catch(error => console.error('There was a problem with the fetch operation:', error));
    }


</script>
</body>
</html>
