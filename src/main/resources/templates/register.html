<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
    </style>

</head>
<body>
<div class="form-container">
    <h1>Register</h1>
    <form id="regUserModal">
        <div class="form-group">
            <label for="reg-firstname">Firstname: </label>
            <input type="text" class="form-control" id="reg-firstname" required>
        </div>
        <div class="form-group">
            <label for="reg-lastname">Lastname: </label>
            <input type="text" class="form-control" id="reg-lastname" required>
        </div>
        <div class="form-group">
            <label for="reg-age">Age: </label>
            <input type="number" class="form-control" id="reg-age" required>
        </div>
        <div class="form-group">
            <label for="reg-email">Email: </label>
            <input type="email" class="form-control" id="reg-email" required>
        </div>
        <div class="form-group">
            <label for="reg-username">Username: </label>
            <input type="text" class="form-control" id="reg-username" required>
        </div>
        <div class="form-group">
            <label for="reg-password">Password: </label>
            <input type="password" class="form-control" id="reg-password" required>
        </div>
        <div class="form-group">
            <label for="roles">Roles</label>
            <select id="roles" class="form-control" name="roles" multiple required>

                <option value="ROLE_USER">User</option>
                <option value="ROLE_ADMIN">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
</div>
<script>
    function loadRoles(selectedRoles = []) {
        fetch('/api/auth/allRoles')
            .then(response => response.json())
            .then(roles => {
                const rolesSelect = document.getElementById('roles');
                rolesSelect.innerHTML = '';

                roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.name;
                    option.textContent = role.name;

                    if (selectedRoles.includes(role.name)) {
                        option.selected = true;
                    }

                    rolesSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error loading roles:', error);
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadRoles();
    });

    document.getElementById("regUserModal").addEventListener("submit", function(event) {
        event.preventDefault();

        const selectedRoles = Array.from(document.getElementById('roles').selectedOptions)
            .map(option => option.value);

        const user = {
            firstname: document.getElementById('reg-firstname').value,
            lastname: document.getElementById('reg-lastname').value,
            age: document.getElementById('reg-age').value,
            username: document.getElementById('reg-username').value,
            password: document.getElementById('reg-password').value,
            email: document.getElementById('reg-email').value,
            roles: selectedRoles
        };

        fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('User registered successfully!');
                    window.location.href = '/api/auth/login';
                } else {
                    alert('Failed to register user: ' + (data.message || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred.');
            });
    });

</script>
</body>
</html>
