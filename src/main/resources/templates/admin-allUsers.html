<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>

    </style>
</head>
<body>
<div class="container">
    <header>
        <span id="allUsers">Loading user details...</span>
        <a href="/logout">Logout</a>
    </header>
    <nav>
        <ul>
            <li><a href="#" class="active">Admin</a></li>
            <li><a href="#">User</a></li>
        </ul>
    </nav>
    <main>
        <h1>Admin Panel</h1>
        <div class="actions">
            <button id="newUserBtn">New User</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="userTableBody">

            </tbody>
        </table>
    </main>
</div>

<div id="regUserModal" class="modal">
    <div class="modal-content">
        <span class="close"></span>
        <h2>Register User</h2>
        <form id="regUserForm">

        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const regUserModal = document.getElementById("regUserModal");
        const regUserForm = document.getElementById("regUserForm");
        const newUserBtn = document.getElementById("newUserBtn");
        const closeBtn = document.querySelector(".close");
        const userTableBody = document.getElementById("userTableBody");
        const allUsers = document.getElementById("allUsers");

        function openModal() {
            regUserModal.style.display = "block";
        }

        function closeModal() {
            regUserModal.style.display = "none";
        }

        newUserBtn.addEventListener("click", openModal);
        closeBtn.addEventListener("click", closeModal);
        window.addEventListener("click", (event) => {
            if (event.target === regUserModal) {
                closeModal();
            }
        });

        regUserForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            if (typeof data.roles === 'string') {
                data.roles = [data.roles];
            }

            fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('User registered successfully.');
                        closeModal();
                        fetchUsers();
                    } else {
                        alert('Registration failed: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });
        });

        function fetchUsers() {
            fetch('/api/admin/allUsers')
                .then(response => response.json())
                .then(users => {
                    userTableBody.innerHTML = '';
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.firstName}</td>
                            <td>${user.lastName}</td>
                            <td>${user.age}</td>
                            <td>${user.email}</td>
                            <td>${user.roles.join(', ')}</td>
                            <td><button class="edit" data-id="${user.id}">Edit</button></td>
                            <td><button class="delete" data-id="${user.id}">Delete</button></td>
                        `;
                        userTableBody.appendChild(row);
                    });
                });
        }

        function fetchAllUsers() {
            fetch('/api/admin/allUsers')
                .then(response => response.text())
                .then(html => {
                    allUsers.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error fetching user details:', error);
                    allUsers.textContent = 'Error loading user details';
                });
        }

        fetchUsers();
        fetchAllUsers();
    });
</script>
</body>
</html>
