<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        /* styles.css */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            background-color: #444;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
        }

        nav ul li a.active {
            background-color: #666;
        }

        main {
            flex: 1;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .actions {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th, table td {
            padding: 10px;
            border: 1px solid #ccc;
        }

        table th {
            background-color: #f0f0f0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
        }

        button#newUserBtn {
            background-color: #007bff;
            color: #fff;
        }

        button.edit {
            background-color: #17a2b8;
            color: #fff;
        }

        button.delete {
            background-color: #dc3545;
            color: #fff;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span id="userDetails">Loading user details...</span>
        <a href="/logout">Logout</a>
    </header>
    <nav>
        <ul>
            <li><a href="#" class="active">Admin</a></li>
            <li><a href="#">User</a></li>
        </ul>
    </nav>
    <main>
        <h1>Admin panel</h1>
        <div class="actions">
            <button id="newUserBtn">New User</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
        </table>
    </main>
</div>

<div id="regUserModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Register User</h2>
        <form id="regUserForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="roles">Role:</label>
            <select id="roles" name="roles" required>
                <option value="ADMIN">ADMIN</option>
                <option value="USER">USER</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const regUserModal = document.getElementById("regUserModal");
        const regUserForm = document.getElementById("regUserForm");
        const newUserBtn = document.getElementById("newUserBtn");
        const closeBtn = document.querySelector(".close");
        const userTableBody = document.getElementById("userTableBody");
        const userDetails = document.getElementById("userDetails");

        function openModal() {
            regUserModal.style.display = "block";
        }

        function closeModal() {
            regUserModal.style.display = "none";
        }

        newUserBtn.addEventListener("click", openModal);
        closeBtn.addEventListener("click", closeModal);
        window.addEventListener("click", (event) => {
            if (event.target === regUserModal) {
                closeModal();
            }
        });

        regUserForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            if (typeof data.roles === 'string') {
                data.roles = [data.roles];
            }

            fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('User registered successfully.');
                        closeModal();
                        fetchUsers();
                    } else {
                        alert('Registration failed: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });
        });

        function fetchUsers() {
            fetch('/api/admin/allUsers')
                .then(response => response.json())
                .then(users => {
                    userTableBody.innerHTML = '';
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.age}</td>
                        <td>${user.email}</td>
                        <td>${user.roles.join(', ')}</td>
                        <td><button class="edit" data-id="${user.id}">Edit</button></td>
                        <td><button class="delete" data-id="${user.id}">Delete</button></td>
                    `;
                        userTableBody.appendChild(row);
                    });
                });
        }

        function fetchUserDetails() {
            fetch('/api/user/home')
                .then(response => response.json())
                .then(data => {
                    const roles = data.roles.map(role => role.name).join(', ');
                    userDetails.textContent = `${data.username} with roles [${roles}]`;
                })
                .catch(error => {
                    console.error('Error fetching user details:', error);
                    userDetails.textContent = 'Error loading user details';
                });
        }

        fetchUsers();
        fetchUserDetails();
    });
</script>
</body>
</html>
