<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
<h1>Delete User</h1>
<form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post" >
    <input type="hidden" th:field="*{user.id}">

    <div class="form-group">
        <label for="username">Username: </label>
        <input type="text" id="username" name="username" th:field="*{user.username}" required>
    </div>
    <div class="form-group">
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" th:field="*{user.password}" required>
    </div>
    <div class="form-group">
        <label for="firstname">Firstname: </label>
        <input type="text" id="firstname" name="firstname" th:field="*{user.firstname}" required>
    </div>
    <div class="form-group">
        <label for="lastname">Lastname: </label>
        <input type="text" id="lastname" name="lastname" th:field="*{user.lastname}" required>
    </div>
    <div class="form-group">
        <label for="age">Age: </label>
        <input type="text" id="age" name="age" th:field="*{user.age}" required>
    </div>
    <div class="form-group">
        <label for="email">Email: </label>
        <input type="text" id="email" name="email" th:field="*{user.email}" required>
    </div>
    <div class="form-group">
        <label for="roles">Roles</label>
        <select id="roles" name="roles" th:field="*{user.roles}">
            <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}"></option>
        </select>
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="/admin" class="btn btn-secondary">Cancel</a>
    </div>
</form>
<a href="/admin">Back to Admin</a>
</div>
<script src="/js/jquery-3.5.1.slim.min.js"></script>
<script src="/js/popper.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
</body>
</html>
